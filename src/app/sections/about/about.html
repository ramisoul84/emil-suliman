<section id="about">
  <div class="about-layout" [attr.data-active]="lit() ?? active()" [class.run]="lit() !== null">

    <div class="title about-title">about me</div>
    <!-- between the title and the photo: the same moving bars as under the photo -->
    <div class="m mr hbars top-bars" aria-hidden="true" style="--c:0;--r:2;--cs:16;--rs:1;--o:21;--p:22;--bar:12.5"></div>

    <!-- phones (Emil's ttt.mp4, 22 Oct): the photo a little landscape; pressed, it fades back
         and the intro is over it in black (again: the photo) -->
    <button type="button" class="ph-photo" [class.open]="introOpen()" [attr.aria-pressed]="introOpen()"
      (click)="introOpen.set(!introOpen())">
      <img src="assets/images/emil-phone.webp" alt="Emil Suliman" width="1440" height="900" loading="lazy" decoding="async">
      <span class="ph-intro">{{ 'ABOUT.INTRO' | translate }}</span>
    </button>

    <div class="photo">
      <img src="assets/images/emil.webp" alt="Emil Suliman" width="640" height="640" loading="eager" decoding="async">
      @if (canPlayReveal) {
      <!-- pixel-to-photo reveal, once: when the photo first comes into view -->
      <video #reveal class="reveal" muted playsinline preload="none" aria-hidden="true">
        <source src="assets/videos/emil.webm" type="video/webm">
      </video>
      }
      <!-- the photo in depth with the mouse, over the reveal once it has played (parallax.ts):
           the city behind, Emil in front -->
      <div #depth class="depth" aria-hidden="true">
        <img class="depth-back" alt="" decoding="async">
        <img class="depth-front" alt="" decoding="async">
      </div>
    </div>

    <div class="panel" data-snap>
      <p class="intro">{{ 'ABOUT.INTRO' | translate }}</p>
      <div class="switcher">
        <!-- both arrows before the topic -->
        <span class="arrows">
          <button type="button" class="arrow prev" (click)="step(-1)" aria-label="previous topic"></button>
          <button type="button" class="arrow next" (click)="step(1)" aria-label="next topic"></button>
        </span>
        <span class="topic swap" [class.out]="fading()" aria-live="polite">{{ topics[shown()].label | translate }}</span>
      </div>
      <div class="text swap" [class.out]="fading()" [innerHTML]="topics[shown()].text | translate | paragraphs"></div>
    </div>

    @if (phone) {
    <!-- phones (Emil's sketches, 23 Oct): the four topics in frames of one size under the photo,
         each its symbol, its name and a + (Emil's mockup); tapped, a frame opens over the others to its whole
         text (they stay put underneath); tapped again, or anywhere else, it folds back -->
    <div class="ph-topics" role="list" [class.has-open]="openTopic() !== null">
      @for (t of topics; track t.key; let i = $index) {
      <div class="ph-card" role="listitem">
        <div class="ph-card-btn" role="button" tabindex="0" [style.--i]="i" [class.open]="openTopic() === i"
          [class.closing]="closingTopic() === i" [attr.aria-expanded]="openTopic() === i"
          [style.--open-top]="openTop()" [style.--open-rows]="openRows()" (click)="toggleTopic(i)"
          (keydown.enter)="toggleTopic(i)" (keydown.space)="$event.preventDefault(); toggleTopic(i)">
          <span class="ph-band" aria-hidden="true">
            <span class="sprite {{ symbols[t.key].cls }}" [style.--cx]="symbols[t.key].card[0]" [style.--cy]="symbols[t.key].card[1]"
              [style.--ch]="symbols[t.key].card[2]" [style.--ca]="symbols[t.key].w / symbols[t.key].h"><canvas aria-hidden="true"></canvas></span>
          </span>
          <span class="ph-name">{{ t.label | translate }}</span>
          <span class="ph-sign" aria-hidden="true"></span>
          <span class="ph-text">{{ t.text | translate }}</span>
        </div>
      </div>
      }
    </div>
    }

    <div class="scroller">
      <div class="stage" role="group" aria-label="Word collage. Pick the tree, house, camera or duck to highlight a topic.">
        <!-- tiles on grid cells. g-* = topics that tint the tile; tree/house/camera/duck are the buttons -->
        <div class="t p-diag g-urban pick" role="button" tabindex="0" aria-label="urban development" [attr.aria-pressed]="active() === 'urban'" (click)="pick('urban')" (keydown.enter)="pick('urban')" (keydown.space)="$event.preventDefault(); pick('urban')" style="--c:21;--r:0;--cs:4;--rs:4;z-index:1"></div>
        <div class="t p-diag g-urban" data-word="urban development" style="--c:25;--r:0;--cs:15;--rs:2;z-index:1"></div>
        <div class="t p-diag g-urban" data-word="safety" style="--c:16;--r:2;--cs:5;--rs:2;z-index:1"></div>
        <div class="t p-diag-h g-urban g-arch" data-word="sustainability" style="--c:31;--r:2;--cs:6;--rs:3;z-index:1"></div>
        <div class="t p-diag-h g-urban g-arch" data-word="re/upcycling" style="--c:37;--r:2;--cs:5;--rs:1;z-index:1"></div>
        <div class="t p-diag-h g-urban g-arch" data-word="materials" style="--c:42;--r:2;--cs:6;--rs:2;z-index:1"></div>
        <div class="t p-diag-grid g-urban g-arch g-story" data-word="freedom" style="--c:25;--r:3;--cs:7;--rs:2;z-index:2"></div>
        <div class="t p-diag g-urban" data-word="human / immigrant" style="--c:0;--r:3;--cs:16;--rs:2;z-index:1"></div>

        <div class="t p-hlines g-arch pick" role="button" tabindex="0" aria-label="architecture" [attr.aria-pressed]="active() === 'arch'" (click)="pick('arch')" (keydown.enter)="pick('arch')" (keydown.space)="$event.preventDefault(); pick('arch')" style="--c:44;--r:4;--cs:7;--rs:5;z-index:1"></div>

        <div class="t p-vlines g-story pick" role="button" tabindex="0" aria-label="storytelling" [attr.aria-pressed]="active() === 'story'" (click)="pick('story')" (keydown.enter)="pick('story')" (keydown.space)="$event.preventDefault(); pick('story')" style="--c:23;--r:11;--cs:5;--rs:5;z-index:1"></div>
        <div class="t p-dotgrid g-arch g-story g-personal" data-word="media architecture" style="--c:35;--r:12;--cs:8;--rs:2;z-index:1"></div>
        <div class="t p-dotgrid g-arch g-story g-personal" data-word="storytelling" style="--c:28;--r:12;--cs:7;--rs:2;z-index:1"></div>
        <div class="t p-dotgrid g-arch g-story g-personal" data-word="light" style="--c:43;--r:12;--cs:5;--rs:3;z-index:1"></div>
        <div class="t p-dotgrid g-story g-personal" data-word="film" style="--c:34;--r:14;--cs:3;--rs:3;z-index:1"></div>
        <div class="t p-dotgrid g-story g-personal" data-word="animation" style="--c:28;--r:14;--cs:4;--rs:2;z-index:1"></div>
        <div class="t p-dotgrid g-story g-personal" data-word="sound" style="--c:42;--r:14;--cs:3;--rs:3;z-index:2"></div>
        <div class="t p-dots g-personal pick" role="button" tabindex="0" aria-label="experience design" [attr.aria-pressed]="active() === 'personal'" (click)="pick('personal')" (keydown.enter)="pick('personal')" (keydown.space)="$event.preventDefault(); pick('personal')" style="--c:37;--r:15;--cs:5;--rs:4;z-index:1"></div>
        <div class="t p-dotgrid g-story g-personal" data-word="electronic music" style="--c:45;--r:15;--cs:6;--rs:2;z-index:1"></div>
        <!-- see-through tiles -->
        <div class="t clear" style="--c:0;--r:2;--cs:16;--rs:1"></div>
        <div class="t clear ot or ob" style="--c:6;--r:5;--cs:10;--rs:1"></div>
        <div class="t clear p-diag ot or ob ol g-urban" style="--c:25;--r:2;--cs:6;--rs:1"></div>
